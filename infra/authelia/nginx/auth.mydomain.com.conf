# nginx server blocks for Authelia (OIDC provider), for the proxy Pi. Domain: auth.mydomain.com.
# Replace `mydomain.com`, TLS paths and the upstream. `@AUTHELIA_UPSTREAM@` is the Mise host LAN
# address, e.g. 192.168.1.20:9091 (published on LAN only and firewalled to the proxy, ADR-012).
# Place `limit_req_zone` lines in the http{} context (conf.d files are included there).

limit_req_zone $binary_remote_addr zone=authelia_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=authelia_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name auth.mydomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.mydomain.com;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP and frame protections are set by Authelia itself; do not override them here.

    client_max_body_size 1m;
    server_tokens off;

    # Brute-force throttling in addition to Authelia's own regulation (3 tries / 2 min -> 10 min ban).
    location ~ ^/api/(firstfactor|secondfactor|webauthn|totp) {
        limit_req zone=authelia_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/authelia-proxy.conf;
    }

    # The portal is a SPA that fetches many assets at once: static files are not request-limited
    # (a limit here made chunks fail with 503 during the spike).
    location /static/ {
        include /etc/nginx/snippets/authelia-proxy.conf;
    }

    # Forward-auth endpoints are not used by Mise (OIDC only): never expose them publicly.
    location /api/authz/ {
        return 404;
    }

    # Everything else: the login portal and the OIDC provider endpoints.
    location / {
        limit_req zone=authelia_general burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/authelia-proxy.conf;
    }
}
