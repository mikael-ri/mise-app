# Save as /etc/nginx/snippets/authelia-proxy.conf on the proxy Pi.
# Authelia derives its public issuer URL from these forwarded headers: they must describe the
# PUBLIC request exactly (scheme and host[:port]).
proxy_pass http://@AUTHELIA_UPSTREAM@;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_buffering on;
