# DRAFT nginx server block for the Mise app, for the proxy Pi. Domain: mise.mydomain.com.
# The Mise server does not exist yet (card A07 onwards); this fixes the proxy contract so the
# spike and your real environment test the same edge. `@MISE_UPSTREAM@` e.g. 192.168.1.20:3000.

limit_req_zone $binary_remote_addr zone=mise_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mise_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mise.mydomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mise.mydomain.com;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
    client_max_body_size 10m;

    # Login start and OIDC callback: tight rate limit, never cached.
    location /auth/ {
        limit_req zone=mise_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    # Live shopping SSE (ADR-004): no buffering, long read timeout so the stream survives idle periods.
    location ~ ^/api/.*/events$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    location / {
        limit_req zone=mise_api burst=60 nodelay;
        include /etc/nginx/snippets/mise-proxy.conf;
    }
}
