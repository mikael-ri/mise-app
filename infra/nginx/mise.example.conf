# nginx server block for the Mise app on the proxy Pi (A19, ADR-012, tech §3). Domain: mise.mydomain.com.
# Install: copy to /etc/nginx/conf.d/mise.conf and `mise-proxy.conf` to /etc/nginx/snippets/, then replace
# `mydomain.com`, `@TLS_CERT@` / `@TLS_KEY@` and `@MISE_UPSTREAM@` (the Mise host LAN address and the
# published app port, e.g. 192.168.1.20:3000). `nginx -t && systemctl reload nginx`.
# Authelia's server block is in infra/authelia/nginx/ (ADR-012 addendum said A19 reuses that folder; the Mise
# block moved here, an ADR amendment is proposed in the A19 hand-off).
#
# The app sets CSP and the other security headers itself (apps/server/src/platform/security.ts); nginx
# owns only HSTS and nosniff so that they are also on nginx's own responses (429, 502).

# http{} context (conf.d files are included there).
limit_req_zone $binary_remote_addr zone=mise_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mise_general:10m rate=30r/s;

# Unknown Host headers (scanners, direct-IP requests) get no response instead of the Mise block.
# Skip these two blocks if your proxy Pi already defines default servers for 80/443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name mise.mydomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mise.mydomain.com;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MiseSSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    # Milestone A has no uploads; JSON bodies are small (the app's own limit is 1 MiB).
    client_max_body_size 1m;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req_status 429;

    # Login start and OIDC callback: tight limit (the app has its own per-IP limit behind this).
    location /api/v1/auth/oidc/ {
        limit_req zone=mise_login burst=5 nodelay;
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    # Live shopping SSE (ADR-004): no buffering, read timeout well above the 25 s heartbeat.
    location ~ ^/api/v1/shopping-lists/[^/]+/events$ {
        limit_req zone=mise_general burst=20 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    location /api/ {
        limit_req zone=mise_general burst=60 nodelay;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    # Content-hashed SPA bundles: public, no household data, fetched in bursts on first load
    # (a request limit here would fail chunks, as the Authelia spike showed for /static/).
    location /assets/ {
        include /etc/nginx/snippets/mise-proxy.conf;
    }

    # SPA shell and client-side routes.
    location / {
        limit_req zone=mise_general burst=60 nodelay;
        include /etc/nginx/snippets/mise-proxy.conf;
    }
}
