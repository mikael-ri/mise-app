# Save as /etc/nginx/snippets/mise-proxy.conf on the proxy Pi (included by mise.example.conf).
# X-Forwarded-For is OVERWRITTEN with the TCP peer, never appended: with TRUST_PROXY=<proxy Pi IP>
# the app then keys rate limits on the real client IP and a client cannot spoof it.
proxy_pass http://@MISE_UPSTREAM@;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
